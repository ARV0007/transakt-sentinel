name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: unit · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [transakt-mcp, risk-scorer, investigator]
    # A real Redis, so the scorer's concurrency test runs against the real thing.
    services:
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      REDIS_TEST_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  e2e:
    name: end-to-end (fake Transakt, real everything else)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r services/transakt-mcp/requirements.txt \
                      -r services/risk-scorer/requirements.txt \
                      -r services/investigator/requirements.txt
      - run: python e2e/run_e2e.py --minutes 1.5

  docker:
    name: docker images (code readable by the service user)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Reproduce the 23 Oct failure: files that are owner-read-only on the build
      # machine. Every image must still be able to import its own code as the
      # unprivileged user it runs as — which is what COPY --chown guarantees.
      - run: chmod -R go-rwx services
      - name: build and import-check each service
        run: |
          set -e
          for s in transakt-mcp:app.server risk-scorer:app.main investigator:app.main; do
            svc=${s%%:*}; mod=${s##*:}
            docker build -q -t sentinel-$svc services/$svc
            docker run --rm -e MCP_TOKEN=ci sentinel-$svc python -c "import $mod; print('$svc ok as', __import__('getpass').getuser())"
          done
